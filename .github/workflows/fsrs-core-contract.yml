name: fsrs-core Contract Gate

on:
  pull_request:
    paths:
      - "supabase/functions/schedule-review/**"
      - "supabase/functions/generate-recovery-flashcard/**"
      - ".github/workflows/fsrs-core-contract.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/schedule-review/**"
      - "supabase/functions/generate-recovery-flashcard/**"
      - ".github/workflows/fsrs-core-contract.yml"

jobs:
  contract:
    name: FSRS core contract regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Run fsrs-core contract tests
        env:
          SUPABASE_CONTRACT_USER_JWT: ${{ secrets.SUPABASE_CONTRACT_USER_JWT }}
          USER_JWT: ${{ secrets.SUPABASE_CONTRACT_USER_JWT }}
        run: |
          deno test --allow-net --allow-env \
            supabase/functions/schedule-review/__tests__/contract.test.ts \
            supabase/functions/generate-recovery-flashcard/__tests__/contract.test.ts
