name: process-upload Contract Gate

on:
  pull_request:
    paths:
      - "supabase/functions/process-upload/**"
      - ".github/workflows/process-upload-contract.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/process-upload/**"
      - ".github/workflows/process-upload-contract.yml"

jobs:
  contract:
    name: Process upload contract regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Run contract tests
        env:
          SUPABASE_CONTRACT_USER_JWT: ${{ secrets.SUPABASE_CONTRACT_USER_JWT }}
          USER_JWT: ${{ secrets.SUPABASE_CONTRACT_USER_JWT }}
        run: |
          deno test --allow-net --allow-env \
            supabase/functions/process-upload/__tests__/contract.test.ts
