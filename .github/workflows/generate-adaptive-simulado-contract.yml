name: generate-adaptive-simulado Contract Gate

# Freeze-safe CI gate: runs the regression contract suite for the
# `generate-adaptive-simulado` Edge Function on every PR that touches it.
#
# MODE A (no token): always runs. Validates public scenarios:
#   - 401 unauthenticated
#   - OPTIONS / CORS
#   - structural absence of runtime crash
#
# MODE B (with secret SUPABASE_CONTRACT_USER_JWT): runs full 21/21 battery.

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'supabase/functions/generate-adaptive-simulado/**'
      - '.github/workflows/generate-adaptive-simulado-contract.yml'
  push:
    branches: [main, master]
    paths:
      - 'supabase/functions/generate-adaptive-simulado/**'
  workflow_dispatch:

jobs:
  contract:
    name: Contract regression (21 scenarios)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run contract suite
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_CONTRACT_USER_JWT: ${{ secrets.SUPABASE_CONTRACT_USER_JWT }}
        run: |
          deno test \
            --allow-net --allow-env --allow-read \
            supabase/functions/generate-adaptive-simulado/__tests__/contract.test.ts
