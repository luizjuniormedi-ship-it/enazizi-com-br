name: Edge Contract Guard

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'supabase/functions/**'
      - 'scripts/check-edge-imports.ts'
      - 'e2e/edge-function-boot.spec.ts'
      - '.github/workflows/edge-contract-guard.yml'
  workflow_dispatch:

jobs:
  guard:
    name: Block broken edge imports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint edge imports (strict)
        run: npm run check:edge-imports

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Edge function boot smoke test
        run: npx playwright test e2e/edge-function-boot.spec.ts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
